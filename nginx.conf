server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy para la API
    location /api/ {
        proxy_pass http://developer.jquiroz.net:3005/;
        proxy_set_header Host developer.jquiroz.net;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Redirige todo a index.html para el routing de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}
